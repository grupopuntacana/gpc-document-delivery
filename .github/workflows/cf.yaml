name: Cloud Foundry

on:
  workflow_call:
    inputs:
      environment:
        default: Staging
        type: string
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read
  deployments: write

concurrency:
  group: cf-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  APP_NAME: gpc-docdelivery
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: cap-js/cf-setup@v1
        with:
          cf-api: ${{ vars.CF_API }}
          cf-org: ${{ vars.CF_ORG }}
          cf-space: ${{ vars.CF_SPACE }}
          cf-username: ${{ vars.CF_USERNAME }}
          cf-password: ${{ secrets.CF_PASSWORD }}
      - run: npm install
      # On a tag deploy, surface the tag (v1.2.0) to the SPA build via APP_VERSION;
      # vite.config.js reads it into __APP_VERSION__. Empty on branch deploys, so
      # the build falls back to git describe / package.json.
      - run: npx cds up
        env:
          APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

      - run: cf logs "${{ env.APP_NAME }}-srv" --recent
        if: always()
      # Temporarily disabled — no db-deployer module yet (no persistence layer).
      # Re-enable once a HANA/db module is added to mta.yaml.
      # - run: cf logs "${{ env.APP_NAME }}-db-deployer" --recent
      #   if: always()

      - name: Get application URL
        id: route
        shell: bash
        run: |
          host=$(cf app "${APP_NAME}" | awk '/routes:/ {print $2}' | sed -E 's#^https?://##; s/,.*$//')
          echo "url=https://$host" >> "$GITHUB_OUTPUT"
    environment:
      name: ${{ inputs.environment || 'Staging' }}
      url:  ${{ steps.route.outputs.url }}
