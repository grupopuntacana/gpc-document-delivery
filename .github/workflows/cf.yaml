name: Cloud Foundry

on:
  # Deploy runs only via release.yaml (on a v* tag, after the verify-ci gate) or
  # a manual dispatch — never directly on push. This keeps every deploy gated.
  workflow_call:
    inputs:
      environment:
        default: Staging
        type: string
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cf-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  APP_NAME: document-delivery
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: cap-js/cf-setup@v1
        with:
          cf-api: ${{ vars.CF_API }}
          cf-org: ${{ vars.CF_ORG }}
          cf-space: ${{ vars.CF_SPACE }}
          cf-username: ${{ vars.CF_USERNAME }}
          cf-password: ${{ secrets.CF_PASSWORD }}
      - run: npm install
      # On a tag deploy, surface the tag (v1.2.0) to the SPA build via APP_VERSION;
      # vite.config.js reads it into __APP_VERSION__. Empty on branch deploys, so
      # the build falls back to git describe / package.json.
      - run: npx cds up
        env:
          APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

      - run: cf logs "${{ env.APP_NAME }}-srv" --recent
        if: always()
      # Temporarily disabled — no db-deployer module yet (no persistence layer).
      # Re-enable once a HANA/db module is added to mta.yaml.
      # - run: cf logs "${{ env.APP_NAME }}-db-deployer" --recent
      #   if: always()

      # The frontend SPA is hosted by the Application Frontend service, not as a CF
      # route on the srv app — so its URL comes from `afctl` (@sap/appfront-cli),
      # not `cf app`. afctl authenticates separately from cf: mint a service key
      # from the already-authenticated cf session (no stored secret), log in with
      # it, and read the deployed app's URL. Best-effort: never fails the deploy.
      - name: Get Application Frontend URL
        id: route
        continue-on-error: true
        shell: bash
        env:
          AF_SERVICE: document-delivery-app-front
          AF_KEY: ci-afctl
          AF_APP: document-delivery.frontend
          AFCTL_COLORS: "false"
        run: |
          cf create-service-key "$AF_SERVICE" "$AF_KEY" >/dev/null 2>&1 || true
          # --service-key takes a JSON string OR a path, but afctl caps every arg
          # at 1024 chars and the key JSON is longer — so write it to a file and
          # pass the path. afctl auto-unwraps the `credentials` envelope.
          KEY_FILE=$(mktemp)
          trap 'rm -f "$KEY_FILE"' EXIT
          cf service-key "$AF_SERVICE" "$AF_KEY" | sed -n '/^{/,$p' > "$KEY_FILE"
          afctl() { npx -y -p @sap/appfront-cli afctl "$@"; }
          afctl login --service-key "$KEY_FILE" >/dev/null || { echo "afctl login failed"; exit 0; }
          # Print the list so every deployed link is visible in the job log.
          echo "----- afctl list -----"
          LIST=$(afctl list 2>&1) || true
          echo "$LIST"
          # `afctl list` shows all apps in the space (Name Version State URL); pick
          # our app's row by name, then take the URL from it.
          URL=$(printf '%s\n' "$LIST" | grep -F "$AF_APP" | grep -Eo 'https://[^[:space:]"]+' | head -1 || true)
          if [ -n "${URL:-}" ]; then
            echo "url=$URL" >> "$GITHUB_OUTPUT"
            echo "Frontend URL: $URL"
          fi
    environment:
      name: ${{ inputs.environment || 'Staging' }}
      url:  ${{ steps.route.outputs.url }}
