_schema-version: 3.3.0
ID: gpc-document-delivery
version: 0.1.0
description: "GPC Document Delivery (CAP) — Milestone 1: Credential Store + Destination spike"
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:
  - name: gpc-docdelivery-srv
    type: nodejs
    path: gen/srv
    properties:
      # Non-secret config: the OpenText folder (objId) the portal lists.
      # 52480 = demo folder holding the invoice/energy PDFs.
      OPENTEXT_FOLDER_ID: "52480"
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
      routes:
        - route: "${default-url}"
        - route: "${default-host}.cert.${default-domain}"
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
          srv-cert-url: '${protocol}://${default-host}.cert.${default-domain}'
    requires:
      - name: gpc-docdelivery-ias
        parameters:
          config:
            credential-type: X509_GENERATED
            app-identifier: srv
      - name: gpc-docdelivery-destination
      # Required to reach OpenText (on-premise) through the Cloud Connector tunnel.
      - name: gpc-docdelivery-connectivity
      # Credential Store (paid) deferred during validation — SHARED_LINK_SECRET
      # is supplied via env (see README). Re-enable this line + the resource below
      # to switch to Credential Store; credstore.js auto-detects the binding.
      - name: gpc-docdelivery-credstore
      - name: gpc-docdelivery-logs

  # Deploys the built portal SPA to the Application Frontend service and
  # registers the srv-api destination the SPA's xs-app.json routes to.
  - name: gpc-docdelivery-app-deployer
    type: com.sap.application.content
    path: gen
    build-parameters:
      build-result: app/
      requires:
        - name: gpcdocdeliveryportal
          artifacts:
            - portal.zip
          target-path: app/
    requires:
      - name: srv-api
      - name: gpc-docdelivery-app-front
        parameters:
          content-target: true
          config:
            IASDependencyName: gpc-docdelivery-ias-api
    parameters:
      config:
        destinations:
          - name: srv-api
            url: ~{srv-api/srv-url}
            forwardAuthToken: true
            IASDependencyName: gpc-docdelivery-ias-api

  # Builds the Vue SPA (app/portal) into dist/ + portal.zip via vite.
  - name: gpcdocdeliveryportal
    type: html5
    path: app/portal
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms: []

resources:
  # IAS-only auth, matching ../bookshop. The app uses `authenticated-user`
  # (no scopes/roles), so XSUAA is not needed; add it (or AMS) only when
  # role/scope-based authorization is introduced.
  - name: gpc-docdelivery-ias
    type: org.cloudfoundry.managed-service
    parameters:
      service: identity
      service-name: gpc-docdelivery-ias
      service-plan: application
      config:
        provided-apis:
          - name: gpc-docdelivery-ias-api
            description: API exposed by the application
        display-name: GPC Document Delivery (DEV)
        oauth2-configuration:
          token-policy:
            access-token-format: "jwt"
        xsuaa-cross-consumption: true
  # Destination Service: holds the OpenText connectivity entries
  # (OpenText_OTDS -> https://otion.grupopuntacana.com:8443, OpenText_OTCS -> https://otion.grupopuntacana.com).
  # Entries are created in the BTP cockpit / via cf CLI after deploy — see README.
  - name: gpc-docdelivery-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
  # Cloud Connector tunnel for OnPremise destinations (OpenText via otds-dev/otcs-dev).
  - name: gpc-docdelivery-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite
  # Credential Store (paid) — DEFERRED during validation. Re-enable this block and
  # the srv `requires` line above to source SHARED_LINK_SECRET (+ CloudFront key) from
  # the Credential Store; credstore.js switches automatically once the binding exists.
  # Holds: SHARED_LINK_SECRET (password) + CloudFrontPrivateKey (key) under a namespace.
  # Confirm the plan name on this tenant ("free" on trial; "standard" otherwise).
  - name: gpc-docdelivery-credstore
    type: org.cloudfoundry.managed-service
    parameters:
      service: credstore
      service-plan: standard
  - name: gpc-docdelivery-logs
    type: org.cloudfoundry.managed-service
    parameters:
      service: application-logs
      service-plan: lite
  # SAP Application Frontend service — hosts the portal SPA (same pattern as ../bookshop).
  - name: gpc-docdelivery-app-front
    type: org.cloudfoundry.managed-service
    parameters:
      service: app-front
      service-plan: developer
