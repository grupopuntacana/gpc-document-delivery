_schema-version: 3.3.0
ID: document-delivery
version: 1.1.0
description: "GPC Document Delivery."
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: document-delivery-srv
    type: nodejs
    path: gen/srv
    properties:
      OPENTEXT_FOLDER_ID: "5816"
      # Ingest has no default folder — an unset registry rejects every upload with 400.
      # The portal SPA writes to `invoices`, so its folderNode must stay equal to
      # OPENTEXT_FOLDER_ID above (the portal lists from that node; a mismatch means an
      # upload succeeds but never shows up in the listing).
      #
      # allowedWriters / allowedReaders are the two per-bucket ACLs (task 0007, ADR 0008),
      # mirroring S3's PutObject vs GetObject: allowedWriters = azps allowed to ingest/claim,
      # allowedReaders = azps allowed to read back and mint delivery links (a writer implies
      # read; a reader does not imply write — this is how a doc uploaded by app X is delivered
      # by app Y). A bucket without allowedWriters accepts NO writers. The value below is a
      # PLACEHOLDER — the portal's real azp is the frontend OIDC client's, which is not in
      # this file and cannot be derived from it. Read it from the denial log line
      # ("upload denied: azp ...") or from the browser's decoded token, then redeploy.
      # Until it is set, the SPA's upload returns 403. Real per-app ACLs belong in the
      # extension descriptor (secrets.mtaext), not `cf set-env` (which a redeploy reverts).
      OPENTEXT_BUCKETS: '{"invoices":{"folderNode":5816,"allowedWriters":["REPLACE-WITH-FRONTEND-AZP"]}}'
      # ARCHIVELINK_REPOSITORIES — S/4 ArchiveLink content repositories (ADR 0009): which azps
      # may mint /doc links via linkForArchive. Empty = the S/4 path grants nothing. Real
      # values (S/4's IAS client azp) belong in secrets.mtaext, like OPENTEXT_BUCKETS.
      ARCHIVELINK_REPOSITORIES: '{}'
      OPENTEXT_DELIVERY_MODE: "cdn"
      AWS_REGION: "us-east-1"
      S3_BUCKET: "opentext-cdn-cache-gpc"
      CLOUDFRONT_DOMAIN: "d3ef18l0vjlle9.cloudfront.net"
      CLOUDFRONT_KEY_PAIR_ID: "KOZINHBBRK0NV"
      SIGNED_URL_TTL_SECONDS: "300"
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
      routes:
        - route: "${default-url}"
        - route: "${default-host}.cert.${default-domain}"
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
          srv-cert-url: '${protocol}://${default-host}.cert.${default-domain}'
    requires:
      - name: document-delivery-db
      - name: document-delivery-ias
        parameters:
          config:
            credential-type: X509_GENERATED
            app-identifier: srv
      - name: document-delivery-destination
      - name: document-delivery-connectivity
      - name: document-delivery-logging
      - name: document-delivery-credstore

  # HDI-container deployer for the Documents ownership/revocation store (ADR 0006, task 0008).
  # `cds build --production` emits the HANA artifacts under gen/db.
  - name: document-delivery-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: document-delivery-db

  - name: document-delivery-app-deployer
    type: com.sap.application.content
    path: gen
    build-parameters:
      build-result: app/
      requires:
        - name: documentdeliveryfrontend
          artifacts:
            - frontend.zip
          target-path: app/
    requires:
      - name: srv-api
      - name: document-delivery-app-front
        parameters:
          content-target: true
          config:
            IASDependencyName: document-delivery-ias-api
    parameters:
      config:
        destinations:
          - name: srv-api
            url: ~{srv-api/srv-url}
            forwardAuthToken: true
            IASDependencyName: document-delivery-ias-api

  - name: documentdeliveryfrontend
    type: html5
    path: app/frontend
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []

resources:
  - name: document-delivery-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: document-delivery-ias
    type: org.cloudfoundry.managed-service
    parameters:
      service: identity
      service-name: document-delivery-ias
      service-plan: application
      config:
        provided-apis:
          - name: document-delivery-ias-api
            description: API exposed by the application
        display-name: document-delivery
        oauth2-configuration:
          token-policy:
            access-token-format: "jwt"
        xsuaa-cross-consumption: true
  - name: document-delivery-app-front
    type: org.cloudfoundry.managed-service
    parameters:
      service: app-front
      service-plan: developer
  - name: document-delivery-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
  - name: document-delivery-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite
  - name: document-delivery-logging
    type: org.cloudfoundry.managed-service
    parameters:
      service: application-logs
      service-plan: lite
  - name: document-delivery-credstore
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: credstore-shared
