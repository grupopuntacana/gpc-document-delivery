_schema-version: 3.3.0
ID: document-delivery
version: 1.0.0
description: "GPC Document Delivery."
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: document-delivery-srv
    type: nodejs
    path: gen/srv
    properties:
      OPENTEXT_FOLDER_ID: "52480"
      OPENTEXT_DELIVERY_MODE: "cdn"
      AWS_REGION: "us-east-1"
      S3_BUCKET: "opentext-cdn-cache-gpc"
      CLOUDFRONT_DOMAIN: "d3ef18l0vjlle9.cloudfront.net"
      CLOUDFRONT_KEY_PAIR_ID: "KOZINHBBRK0NV"
      SIGNED_URL_TTL_SECONDS: "300"
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
      routes:
        - route: "${default-url}"
        - route: "${default-host}.cert.${default-domain}"
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
          srv-cert-url: '${protocol}://${default-host}.cert.${default-domain}'
    requires:
      - name: document-delivery-ias
        parameters:
          config:
            credential-type: X509_GENERATED
            app-identifier: srv
      - name: document-delivery-destination
      - name: document-delivery-connectivity
      - name: document-delivery-logging
      - name: document-delivery-credstore

  - name: document-delivery-app-deployer
    type: com.sap.application.content
    path: gen
    build-parameters:
      build-result: app/
      requires:
        - name: documentdeliveryfrontend
          artifacts:
            - frontend.zip
          target-path: app/
    requires:
      - name: srv-api
      - name: document-delivery-app-front
        parameters:
          content-target: true
          config:
            IASDependencyName: document-delivery-ias-api
    parameters:
      config:
        destinations:
          - name: srv-api
            url: ~{srv-api/srv-url}
            forwardAuthToken: true
            IASDependencyName: document-delivery-ias-api

  - name: documentdeliveryfrontend
    type: html5
    path: app/frontend
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []

resources:
  - name: document-delivery-ias
    type: org.cloudfoundry.managed-service
    parameters:
      service: identity
      service-name: document-delivery-ias
      service-plan: application
      config:
        provided-apis:
          - name: document-delivery-ias-api
            description: API exposed by the application
        display-name: document-delivery
        oauth2-configuration:
          token-policy:
            access-token-format: "jwt"
        xsuaa-cross-consumption: true
  - name: document-delivery-app-front
    type: org.cloudfoundry.managed-service
    parameters:
      service: app-front
      service-plan: developer
  - name: document-delivery-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
  - name: document-delivery-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite
  - name: document-delivery-logging
    type: org.cloudfoundry.managed-service
    parameters:
      service: application-logs
      service-plan: lite
  - name: document-delivery-credstore
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: credstore-shared
